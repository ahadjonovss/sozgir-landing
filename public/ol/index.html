<!doctype html>
<!-- Yuklab olish sahifasi — ulashish uchun alohida qisqa havola: sozgir.uz/ol

     `public/` ichida turadi — React ilovaga tegmaydi va bundle yuklanmaydi.
     Telefonda havola bosilganda sahifa darhol chiqishi kerak, shuning uchun
     hamma narsa shu bitta faylda: uslub ham, mantiq ham.

     Sahifa qurilmani aniqlaydi: telefonda (iOS/Android) darhol shu
     qurilmaning do'koniga yo'naltiradi, sahifa esa zaxira bo'lib qoladi —
     do'kon ochilmasa tugma bosiladi. Kompyuterda yo'naltirish yo'q: do'kon
     havolasi telefonda ochilishi kerak, shuning uchun ikkala tugma va
     eslatma ko'rsatiladi. Telegram preview'i buzilmaydi — bot JS
     ishlatmaydi va oddiy sahifani ko'radi. `?stay=1` bilan ochilsa
     telefonda ham yo'naltirilmaydi (sahifani ko'rish uchun).

     Do'kon manzillari `src/data/site.ts` dagi `links` bilan bir xil
     bo'lishi kerak — biri o'zgarsa, ikkinchisi ham o'zgaradi. -->
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">

<title>So‘zgir ilovasini yuklab olish</title>
<meta name="description" content="So‘zgir — o‘zbekcha so‘z o‘yinlari. iPhone va Android uchun bepul, internetsiz ham ishlaydi, ilova ichi xaridlari yo‘q.">
<link rel="canonical" href="https://sozgir.uz/ol">
<link rel="icon" type="image/png" href="/icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="So‘zgir">
<meta property="og:locale" content="uz_UZ">
<meta property="og:url" content="https://sozgir.uz/ol">
<meta property="og:title" content="So‘zgir ilovasini yuklab olish">
<meta property="og:description" content="Kuniga bitta o‘zbekcha so‘z. iPhone va Android uchun bepul, xaridsiz.">
<meta property="og:image" content="https://sozgir.uz/icon.png">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Landing dizayn tizimidagi tokenlarning shu sahifaga kerakli qismi. */
  :root {
    --bg: #ffffff;
    --surface: #f7f9fc;
    --text: #16181d;
    --text-2: #7a8290;
    --divider: #eceef2;
    --green: #63a967;
    --green-soft: rgba(99, 169, 103, 0.14);
    --ink: #16181d;
    --ink-text: #ffffff;
    --radius-lg: 26px;
    --radius-md: 16px;
    --shadow: 0 1px 2px rgba(22, 24, 29, 0.04), 0 8px 24px rgba(22, 24, 29, 0.06);
  }
  :root[data-theme='dark'] {
    --bg: #121317;
    --surface: #1b1d23;
    --text: #f3f4f6;
    --text-2: #9aa1ae;
    --divider: #262a31;
    --green: #5e9e63;
    --green-soft: rgba(94, 158, 99, 0.2);
    --ink: #f3f4f6;
    --ink-text: #121317;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font-family: Nunito, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                 Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }
  .card {
    width: 100%;
    max-width: 420px;
    padding: 32px 24px 26px;
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .icon {
    width: 84px;
    height: 84px;
    margin: 0 auto 18px;
    display: block;
    border-radius: 20px;
  }
  h1 { margin: 0 0 8px; font-size: 25px; font-weight: 900; letter-spacing: -0.4px; }
  .lead { margin: 0; color: var(--text-2); }

  /* Kataklar — ilovadagi taxta ranglari, sahifa nima haqda ekanini
     bir qarashda aytadi. */
  .tiles { display: flex; gap: 6px; justify-content: center; margin: 0 0 18px; }
  .tile {
    width: 30px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    background: var(--green);
  }
  .tile--soft { background: var(--green-soft); color: var(--text); }

  .stores { display: flex; flex-direction: column; gap: 10px; margin: 22px 0 0; }
  .store {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 18px;
    border-radius: var(--radius-md);
    border: 1px solid var(--divider);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    /* Telefonda barmoq uchun: Apple tavsiya qilgan eng kichik nishon. */
    min-height: 52px;
  }
  .store:active { transform: scale(0.985); }
  /* Qurilmaga tegishli do'kon — birinchi va to'q tugma. */
  .store--primary {
    order: -1;
    background: var(--ink);
    color: var(--ink-text);
    border-color: var(--ink);
  }
  .store svg { flex: none; }

  .facts {
    margin: 22px 0 0;
    padding-top: 18px;
    border-top: 1px solid var(--divider);
    font-size: 14px;
    color: var(--text-2);
  }
  .home {
    display: inline-block;
    margin-top: 16px;
    font-size: 14px;
    font-weight: 700;
    color: var(--green);
    text-decoration: none;
  }
  .home:hover { text-decoration: underline; }
</style>
<script>
  // Mavzu birinchi chizishdan oldin — landing bilan bir kalit.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('sozgir.theme'); } catch (error) { saved = null; }
    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
  })();
</script>
</head>
<body>
  <main class="card">
    <img class="icon" src="/icon.png" alt="So‘zgir" width="84" height="84">

    <div class="tiles" aria-hidden="true">
      <span class="tile">S</span>
      <span class="tile tile--soft">O‘</span>
      <span class="tile">Z</span>
      <span class="tile tile--soft">G‘</span>
      <span class="tile">I</span>
      <span class="tile">R</span>
    </div>

    <h1>So‘zgir ilovasi</h1>
    <p class="lead" id="lead">Kuniga bitta o‘zbekcha so‘z. Bepul, xaridsiz,
      internetsiz ham ishlaydi.</p>

    <div class="stores">
      <a class="store" id="ios" href="https://apps.apple.com/app/id6807138456">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.2 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.2.9-1.2 1.3-2.5 1.3-2.5s-2.5-1-2.5-3.6zM14.2 5.8c.6-.8 1.1-1.9 1-3-1 0-2.1.6-2.8 1.5-.6.7-1.1 1.9-1 3 1.1.1 2.2-.6 2.8-1.5z" />
        </svg>
        App Store
      </a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=uz.ahadjonovss.soztop">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M3.6 2.3c-.3.3-.5.8-.5 1.4v16.6c0 .6.2 1.1.5 1.4l.1.1 9.3-9.3v-.2L3.6 2.3zM16.3 15.6l-3.1-3.1v-.2l3.1-3.1.1.1 3.7 2.1c1 .6 1 1.6 0 2.2l-3.8 2zM15.9 16l-3.2-3.2-9.1 9.1c.3.4.9.4 1.6.1l10.7-6M15.9 8l-10.7-6c-.7-.4-1.3-.3-1.6.1l9.1 9.1L15.9 8z" />
        </svg>
        Google Play
      </a>
    </div>

    <p class="facts">iOS 15+ va Android 6.0+ · Ilova ichi xaridlari va obuna yo‘q</p>
    <a class="home" href="/">So‘zgir bosh sahifasi →</a>
  </main>

<script>
  (function () {
    var ua = navigator.userAgent || '';

    // iPadOS 13+ o'zini Mac deb ko'rsatadi, shuning uchun sensorli ekran
    // ham tekshiriladi — aks holda iPad'ga Google Play birinchi chiqardi.
    var ios = /iPhone|iPad|iPod/.test(ua) ||
      (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    // «Android» satri iltimosnomada bo'lsa ham, bu Windows'dagi Android
    // emulyatori bo'lishi mumkin — lekin do'kon havolasi baribir to'g'ri.
    var android = /Android/.test(ua);

    var lead = document.getElementById('lead');
    var stay = /[?&]stay=1/.test(location.search);

    // Telefonda darhol do'konga: sahifa faqat do'kon ochilmasa kerak
    // bo'ladi. `replace` — «orqaga» bosilganda shu sahifaga qaytib
    // qolmasin.
    function go(id) {
      var link = document.getElementById(id);
      link.classList.add('store--primary');
      if (stay) return;
      lead.textContent = 'Do‘konga o‘tkazilmoqda… Ochilmasa, tugmani bosing.';
      setTimeout(function () { location.replace(link.href); }, 400);
    }

    if (ios) {
      go('ios');
    } else if (android) {
      go('android');
    } else {
      // Kompyuterda do'kon havolasi telefonda ochilishi kerak — aytib
      // qo'yamiz, aks holda odam do'kon sahifasida qotib qoladi.
      lead.textContent =
        'Kuniga bitta o‘zbekcha so‘z. Havolani telefoningizga yuboring — ' +
        'sozgir.uz/ol';
    }
  })();
</script>
</body>
</html>
